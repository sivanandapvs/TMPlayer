name: Veylora Android and Android TV APK

on:
  push:
    branches:
      - main
      - feature/torbox-integration-rebrand
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veylora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build custom FFmpeg and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Create local Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          grep -F "sdk.dir=$ANDROID_HOME" local.properties
          git check-ignore -q local.properties

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager must accept licences before installing the pinned packages.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'platform-tools' \
            'ndk;25.2.9519653' \
            'cmake;3.22.1'
          # Android 17 is published as android-37.0. Some AGP tooling still
          # probes the legacy android-37 directory name for compileSdk 37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Install FFmpeg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl make meson ninja-build nasm pkg-config patch

      - name: Cache FFmpeg source downloads
        uses: actions/cache@v4
        with:
          path: |
            build/media3ext/downloads
            build/media3ext/ffmpeg-cache
          key: veylora-ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-media3ext.sh', 'scripts/media3ext/tmplayer-decoders.patch') }}
          restore-keys: |
            veylora-ffmpeg-${{ runner.os }}-

      - name: Verify JDK and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -e "$ANDROID_HOME/platforms/android-37"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -d "$ANDROID_HOME/ndk/25.2.9519653"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          command -v meson
          command -v ninja
          command -v nasm

      # Build the repository's pinned FFmpeg/NextLib extension AAR.
      - name: Build custom FFmpeg extension AAR
        env:
          JOBS: '2'
          GRADLE_WORKERS: '2'
        run: bash scripts/build-media3ext.sh

      - name: Verify custom FFmpeg extension
        shell: bash
        run: |
          set -euo pipefail
          AAR='build/media3ext/nextlib-media3ext-1.11.1-0.16.0-tm2.aar'
          test -s "$AAR"
          unzip -t "$AAR"
          AAR_NATIVE_COUNT="$(unzip -Z1 "$AAR" | grep -Ec '^jni/[^/]+/[^/]+\.so$' || true)"
          test "$AAR_NATIVE_COUNT" -gt 0
          sha256sum "$AAR" | tee build/media3ext/custom-aar.sha256

      # The required flag prevents Gradle from silently selecting the reduced Maven fallback.
      - name: Build Veylora debug APK
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          MSONE_GATEWAY_KEY: ${{ secrets.MSONE_GATEWAY_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: ./gradlew --no-daemon --max-workers=2 --no-parallel --console=plain :app:assembleDebug -PtmRequireMedia3ext=true

      - name: Verify APK identity, launchers and signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.veylora'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'Veylora'"
          MANIFEST_TEXT="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          printf '%s\n' "$MANIFEST_TEXT" | grep -F 'android.intent.category.LAUNCHER'
          printf '%s\n' "$MANIFEST_TEXT" | grep -F 'android.intent.category.LEANBACK_LAUNCHER'
          "$APKSIGNER" verify --verbose "$APK"
          APK_NATIVE_COUNT="$(unzip -Z1 "$APK" | grep -Ec '^lib/[^/]+/[^/]+\.so$' || true)"
          test "$APK_NATIVE_COUNT" -gt 0
          mkdir -p dist
          cp "$APK" dist/Veylora-debug.apk
          cp build/media3ext/custom-aar.sha256 dist/
          sha256sum dist/Veylora-debug.apk | tee dist/SHA256SUMS.txt
          {
            echo 'application_id=com.veylora'
            echo 'application_label=Veylora'
            echo 'android_phone_launcher=verified'
            echo 'android_tv_leanback_launcher=verified'
            echo 'ffmpeg_extension=custom tm2 AAR'
            echo "native_library_entries=$APK_NATIVE_COUNT"
            echo "apk_bytes=$(stat -c '%s' dist/Veylora-debug.apk)"
          } | tee dist/BUILD-INFO.txt
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      # Tests run after packaging so a test failure does not discard a verified APK.
      - name: Run shared and Android unit tests
        if: always() && steps.verify.outputs.verified == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --console=plain \
            :core:jvmTest :ui:jvmTest :app:testDebugUnitTest

      - name: Upload Veylora Android and Android TV APK
        if: always() && steps.verify.outputs.verified == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Veylora-Android-Phone-and-TV-${{ github.sha }}
          path: |
            dist/Veylora-debug.apk
            dist/SHA256SUMS.txt
            dist/custom-aar.sha256
            dist/BUILD-INFO.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Veylora-build-reports-${{ github.run_number }}
          path: |
            core/build/reports/tests/
            ui/build/reports/tests/
            app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

# CI trigger: workflow re-enabled; validate current Veylora integration commit.
